<header class="header">
  <div class="header-left">
    @if (authStore.isAuthenticated()) {
      <button
        type="button"
        class="btn-menu-toggle"
        (click)="layoutStore.toggleSidebar()"
        [attr.aria-label]="layoutStore.isSidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
        title="Toggle sidebar"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
    }

    <div class="logo-container" routerLink="/">
      <svg
        class="logo-icon"
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 2L2 7l10 5 10-5-10-5Z" />
        <path d="M2 17l10 5 10-5" />
        <path d="M2 12l10 5 10-5" />
      </svg>
      <span class="logo-text">Martial Arts Arena</span>
    </div>
  </div>

  <div class="actions">
    @if (authStore.isAuthenticated()) {
      <div
        class="user-profile-header"
        [title]="
          authStore.userFullName() +
          ' (' +
          authStore.userRoleName() +
          ') - ' +
          authStore.userEmail()
        "
      >
        <div class="avatar-header">
          {{ authStore.userInitials() }}
        </div>
        <div class="user-meta-header">
          <div class="user-meta-top">
            <span class="user-name">{{ authStore.userFullName() }}</span>
            <span class="user-badge">{{ authStore.userRoleName() || 'Admin' }}</span>
          </div>
          <span class="user-email">{{ authStore.userEmail() }}</span>
        </div>
      </div>
    } @else {
      <a routerLink="/login" class="btn-primary">Sign In</a>
    }
  </div>
</header>

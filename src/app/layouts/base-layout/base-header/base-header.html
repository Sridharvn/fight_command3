<header class="header">
  <div class="header-left">
    @if (authStore.isAuthenticated()) {
      <button
        type="button"
        class="btn-menu-toggle"
        (click)="layoutStore.toggleSidebar()"
        [attr.aria-label]="layoutStore.isSidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
        title="Toggle sidebar"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
    }

    <div class="logo-container" routerLink="/">
      <svg
        class="logo-icon"
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 2L2 7l10 5 10-5-10-5Z" />
        <path d="M2 17l10 5 10-5" />
        <path d="M2 12l10 5 10-5" />
      </svg>
      <span class="logo-text">Martial Arts Arena</span>
    </div>
  </div>

  <nav class="nav-links">
    <a routerLink="/" class="nav-link">Events</a>
    @if (authStore.isAuthenticated()) {
      <a routerLink="/users" class="nav-link">Users</a>
      <a routerLink="/roles" class="nav-link">Roles</a>
    }
  </nav>

  <div class="actions">
    @if (authStore.isAuthenticated()) {
      <div class="user-pill">
        <span class="user-badge">{{ authStore.userRoleName() || 'Admin' }}</span>
        <span class="user-name">{{ authStore.userFullName() }}</span>
      </div>
      <button type="button" class="btn-outline" (click)="authStore.logout()">Sign Out</button>
    } @else {
      <a routerLink="/login" class="btn-primary">Sign In</a>
    }
  </div>
</header>
